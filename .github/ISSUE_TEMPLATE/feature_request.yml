name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: markdown
    attributes:
      value: Diagramon has no dependencies and makes no network calls, so ideas that need either are unlikely to fit.
